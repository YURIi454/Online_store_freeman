{% extends 'base.html'%}

{% block title%}Контакты{% endblock %}
{% load static %}
{% block content %}

<div class="d-flex justify-content-center align-items-center min-vh-50">
    <div class="col-md-3">
        <img src="{% static 'images/bk_grong_con_r.jpg' %}" alt=" . . . " class="img-fluid"/>
    </div>
    <div class="col-md-6 p-3">
        <div class="card text-bg-secondary">
            <div class="card-body" style="background-color: #9ACD32;" >
                <form>
                    <h3>Оставьте свои контакты !</h3>
                    <div class="mb-3">
                        <input type="text" class="form-control" placeholder="Имя">
                    </div>
                    <div class="mb-3" >
                        <input type="email" class="form-control" placeholder="Email">
                    </div>
                    <div class="mb-3">
                        <textarea class="form-control" placeholder="Сообщение" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-outline-success w-100">Отправить</button>
                </form>

            </div>
        </div>
    </div>
    <div class="col-md-3">
        <img src="{% static 'images/bk_grong_con_l.jpg' %}" alt=" . . . " class="img-fluid"/>
    </div>
</div>


{% endblock %}
