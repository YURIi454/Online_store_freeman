{% extends 'base.html'%}

{% block title%}Контакты{% endblock %}
{% load static %}
{% block content %}
<style> body footer { padding-top: 3rem; padding-bottom: 3rem; background-color: #9ACD32;  }</style>
<div class="d-flex justify-content-center align-items-center min-vh-50">
    <div class="col-md-3">
        <img src="{% static 'images/nbk_grong_con_r.jpg' %}" alt=" . . . " class="img-fluid"/>
    </div>
    <div class="col-md-6 p-3">
        <div class="card text-bg-secondary">
            <div class="card-body" style="background-color: #9ACD32;">
                <h3>Оставьте свои контакты !</h3>

                <form action="" method="post">

                    {% csrf_token %}
                    {{ form.as_p }}

                    <button type="submit" class="btn btn-outline-success w-100">Отправить</button>
                </form>

            </div>
        </div>
    </div>
    <div class="col-md-3">
        <img src="{% static 'images/nbk_grong_con_l.jpg' %}" alt=" . . . " class="img-fluid"/>
    </div>
</div>


{% endblock %}
